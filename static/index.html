<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignLab</title>
<style>
:root{--bg:#0b1020;--card:#141b34;--card2:#1b2447;--line:#2a3566;--text:#eaf0ff;--mute:#93a0cf;
--accent:#6ee7b7;--accent2:#7c9cff;--warn:#fbbf24;--bad:#f87171;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#1b2a6b55,transparent),var(--bg);
color:var(--text);font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}.logo span{color:var(--accent)}
nav{display:flex;gap:6px;margin-left:12px}
nav button{background:transparent;color:var(--mute);border:1px solid transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600}
nav button.on{background:var(--card2);color:var(--text);border-color:var(--line)}
.stats{margin-left:auto;display:flex;gap:14px;align-items:center;font-weight:600}
.pill{background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:13px}
.xpbar{width:90px;height:6px;background:#0006;border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.xpbar i{display:block;height:100%;background:var(--accent)}
main{padding:20px 24px;max-width:1300px;margin:auto}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mute)}
.video{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
.video video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.badge{background:#000a;backdrop-filter:blur(6px);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.ok{color:var(--accent)}.no{color:var(--bad)}.wait{color:var(--warn)}
.seeing{display:flex;align-items:center;gap:14px;margin-top:12px}
.seeing .big{font-size:30px;font-weight:800;min-width:150px}
.meter{flex:1;height:14px;background:#0007;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .15s}
.hint{color:var(--mute);font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.chip:hover{border-color:var(--accent2);transform:translateY(-1px)}
.chip small{color:var(--mute);margin-left:6px;font-weight:500}
.chip.word{background:#1f2c5c;display:inline-flex;gap:8px;align-items:center;cursor:default}
.chip.word b{cursor:pointer;color:var(--bad)}
.sentence{font-size:26px;font-weight:700;min-height:70px;margin:10px 0;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{background:var(--accent2);color:#0b1020;border:0;padding:10px 18px;border-radius:12px;font-weight:800;cursor:pointer;font-size:14px}
.btn.alt{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.go{background:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
input[type=text]{flex:1;min-width:160px;background:#0b1230;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:12px;font-size:14px}
label{color:var(--mute);font-size:13px;display:flex;gap:6px;align-items:center}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.palette .chip{text-align:center;border-radius:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.sc .emo{font-size:34px}.sc h4{margin:0;font-size:18px}
.sc p{margin:0;color:var(--mute);font-size:13.5px;flex:1}
.mast{height:6px;background:#0007;border-radius:9px;overflow:hidden}.mast i{display:block;height:100%;background:var(--accent)}
.stage{text-align:center;padding:26px}
.target{font-size:72px;font-weight:900;margin:6px 0;letter-spacing:1px}
.tbar{height:10px;background:#0007;border-radius:99px;overflow:hidden;margin:10px auto;max-width:520px}
.tbar i{display:block;height:100%;width:100%;background:var(--warn);transition:width .1s linear}
.flash{animation:pop .7s}
@keyframes pop{0%{box-shadow:0 0 0 0 #6ee7b7aa}100%{box-shadow:0 0 0 40px #6ee7b700}}
.hit{color:var(--accent);font-weight:800;font-size:22px;min-height:30px}
details{margin-top:10px;color:var(--mute)}
input[type=range]{accent-color:var(--accent2)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--accent);
padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
</style>
</head>
<body>
<header>
  <div class="logo">Sign<span>Lab</span></div>
  <nav>
    <button data-tab="translate" class="on">Translate</button>
    <button data-tab="learn">Learn</button>
    <button data-tab="challenge">Challenge</button>
  </nav>
  <div class="stats">
    <span class="pill">Level <b id="lvl">1</b><span class="xpbar"><i id="xpfill"></i></span></span>
    <span class="pill">XP <b id="xp">0</b></span>
    <span class="pill">Best streak <b id="best">0</b></span>
  </div>
</header>

<main>
<!-- ============ TRANSLATE ============ -->
<section id="translate" class="tab on">
  <div class="grid">
    <div class="card">
      <h3>Live camera</h3>
      <div class="video" id="vbox">
        <video id="clientVideo" autoplay playsinline muted></video>
        <div class="badges">
          <span class="badge" id="bStatus">...</span>
          <span class="badge" id="bHands">Hands 0</span>
          <span class="badge" id="bFace">Face</span>
        </div>
      </div>
      <div class="seeing">
        <div class="big" id="seeName">-</div>
        <div class="meter"><i id="seeBar"></i></div>
        <div id="seePct" style="width:46px;text-align:right;font-weight:700">0%</div>
      </div>
      <div class="hint">Do the sign, then lower your hand to sign the next word. Keep your face and hands in view with good light.</div>

      <h3 style="margin-top:16px">Not sure? Tap what you meant</h3>
      <div class="chips" id="topChips"></div>
      <div class="row">
        <label><input type="checkbox" id="teach" checked> Also save this attempt to improve the model (hold the sign while tapping)</label>
      </div>
      <details>
        <summary>Settings</summary>
        <div class="row">
          <label>Confidence needed <input type="range" id="conf" min="0.3" max="0.9" step="0.05" value="0.5"> <b id="confv">0.50</b></label>
          <label><input type="checkbox" id="llm"> Use Claude for smoother sentences (needs internet + key)</label>
        </div>
      </details>
    </div>

    <div>
      <div class="card">
        <h3>Your sentence</h3>
        <div class="chips" id="wordChips"></div>
        <div class="sentence" id="sentence">Start signing...</div>
        <div class="row">
          <button class="btn go" id="speak">Speak</button>
          <button class="btn alt" id="undo">Undo</button>
          <button class="btn alt" id="clear">Clear</button>
          <button class="btn alt" id="copy">Copy</button>
          <label><input type="checkbox" id="auto"> Auto-speak after a pause</label>
        </div>
      </div>
      <div class="card" style="margin-top:18px">
        <h3>Add words manually</h3>
        <div class="row" style="margin-top:0">
          <input type="text" id="typed" placeholder='Type words, e.g. "I want water please"'>
          <button class="btn" id="addTyped">Add</button>
        </div>
        <div class="palette" id="palette" style="margin-top:12px"></div>
